<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖形推理測驗 App</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 引入外部 CSS 檔案 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>圖形推理練習</h1>

  <!-- API Key 輸入與儲存區塊 -->
  <div id="api-key-container" style="margin: 15px 0; padding: 10px; background: #f0f4f8; border-radius: 8px;">
    <label for="api-key-input" style="font-weight: bold; display: block; margin-bottom: 5px; color: #333;">Gemini API Key：</label>
    <div style="display: flex; gap: 8px;">
      <input type="password" id="api-key-input" placeholder="請在此貼上您的 API Key" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      <button id="save-key-btn" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">儲存 Key</button>
    </div>
    <small id="key-status" style="color: #666; margin-top: 4px; display: block;"></small>
  </div>

  <div class="card">
    <h3 id="question-title">題目載入中...</h3>
    <img id="question-img" src="" alt="題目圖片" crossorigin="anonymous">
    
    <!-- 切換劃掉模式按鈕 -->
    <div style="margin-bottom: 12px; text-align: right;">
      <button id="mode-toggle-btn" class="mode-btn" onclick="toggleMode()">✏️ 劃掉模式：關閉</button>
    </div>

    <!-- 選項按鈕 -->
    <div class="options" id="options-container">
      <button onclick="handleOptionClick('A', this)">A</button>
      <button onclick="handleOptionClick('B', this)">B</button>
      <button onclick="handleOptionClick('C', this)">C</button>
      <button onclick="handleOptionClick('D', this)">D</button>
      <button onclick="handleOptionClick('E', this)">E</button>
    </div>

    <!-- 解題筆記區 -->
    <div style="margin: 15px 0;">
      <label for="user-notes" style="display: block; font-weight: bold; margin-bottom: 5px;">📝 解題思路 / 筆記：</label>
      <textarea id="user-notes" rows="3" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #ccc; resize: vertical;" placeholder="可以在這裡寫下你的推論過程..."></textarea>
    </div>
    
    <div id="result-text" class="result"></div>

    <!-- 答對/答錯後顯示的按鈕選項 -->
    <button id="ai-btn" class="ai-btn" onclick="askAI()">🤖 呼叫 AI 生成詳細解析</button>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➔</button>

    <div id="loading-text" class="loading">⏳ Gemini 正在思考圖形規律中...</div>

    <div id="explanation-box" class="explanation">
      <h4>AI 解析結果：</h4>
      <div id="ai-result"></div>
    </div>
  </div>
<script src="script.js"></script>
 
</body>
</html>
