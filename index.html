  <div id="api-key-container" style="margin: 15px 0; padding: 10px; background: #f0f4f8; border-radius: 8px;">
    <label for="api-key-input" style="font-weight: bold; display: block; margin-bottom: 5px; color: #333;">Gemini API Key：</label>
    <div style="display: flex; gap: 8px;">
      <input type="password" id="api-key-input" placeholder="請在此貼上您的 API Key" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      <button id="save-key-btn" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">儲存 Key</button>
    </div>
    <small id="key-status" style="color: #666; margin-top: 4px; display: block;"></small>
  </div>

  <div class="card">
    <h3 id="question-title">題目載入中...</h3>
    <img id="question-img" src="" alt="題目圖片">
    
    <!-- 切換劃掉模式按鈕 -->
    <div style="margin-bottom: 12px; text-align: right;">
      <button id="mode-toggle-btn" class="mode-btn" onclick="toggleMode()">✏️ 劃掉模式：關閉</button>
    </div>

    <!-- 選項按鈕 -->
    <div class="options" id="options-container">
      <button onclick="handleOptionClick('A', this)">A</button>
      <button onclick="handleOptionClick('B', this)">B</button>
      <button onclick="handleOptionClick('C', this)">C</button>
      <button onclick="handleOptionClick('D', this)">D</button>
      <button onclick="handleOptionClick('E', this)">E</button>
    </div>

    <!-- 解題筆記區 -->
    <div style="margin: 15px 0;">
      <label for="user-notes" style="display: block; font-weight: bold; margin-bottom: 5px;">📝 解題思路 / 筆記：</label>
      <textarea id="user-notes" rows="3" style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #ccc; resize: vertical;" placeholder="可以在這裡寫下你的推論過程..."></textarea>
    </div>
    
    <div id="result-text" class="result"></div>

    <!-- 答對/答錯後顯示的按鈕選項 -->
    <button id="ai-btn" class="ai-btn" onclick="askAI()">🤖 呼叫 AI 生成詳細解析</button>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➔</button>

    <div id="loading-text" class="loading">⏳ Gemini 正在思考圖形規律中...</div>

    <div id="explanation-box" class="explanation">

  let currentQuestion = null;
  let isEliminateMode = false;

  function toggleMode() {
    isEliminateMode = !isEliminateMode;
    const toggleBtn = document.getElementById('mode-toggle-btn');
    if (isEliminateMode) {
      toggleBtn.innerText = '✏️ 劃掉模式：開啟中';
      toggleBtn.classList.add('mode-active');
    } else {
      toggleBtn.innerText = '✏️ 劃掉模式：關閉';
      toggleBtn.classList.remove('mode-active');
    }
  }

  function handleOptionClick(selected, btnElement) {
    if (isEliminateMode) {
      btnElement.classList.toggle('eliminated');
    } else {
      checkAnswer(selected);
    }
  }

  function nextQuestion() {
    document.getElementById('result-text').innerText = '';
    document.getElementById('explanation-box').style.display = 'none';
    document.getElementById('ai-btn').style.display = 'none';
    
    const notesElement = document.getElementById('user-notes');
    if (notesElement) notesElement.value = '';
    
    const optionBtns = document.querySelectorAll('#options-container button');
    optionBtns.forEach(btn => btn.classList.remove('eliminated'));

    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * questionBank.length);
    } while (questionBank.length > 1 && currentQuestion && questionBank[randomIndex].id === currentQuestion.id);

    currentQuestion = questionBank[randomIndex];

    document.getElementById('question-title').innerText = `圖形推理 (第 ${currentQuestion.id} 題)`;
    document.getElementById('question-img').src = currentQuestion.image;
  }

  function checkAnswer(selected) {
    const resultText = document.getElementById('result-text');
    const aiBtn = document.getElementById('ai-btn');

    if (selected === currentQuestion.answer) {
      resultText.innerText = "🎉 答對了！";
      resultText.style.color = "#28a745";
    } else {
      resultText.innerText = `❌ 答錯了！正確答案是 ${currentQuestion.answer}`;
      resultText.style.color = "#dc3545";
    }
    aiBtn.style.display = 'block';
  }

  // 3. AI 解析與 API 請求邏輯
 async function askAI() {
    // 取得並整理 Key（去除前後空白）
    let apiKey = localStorage.getItem('GEMINI_API_KEY') || (apiKeyInput ? apiKeyInput.value.trim() : '');
    apiKey = apiKey.trim();

    if (!apiKey) {
      alert('請先在頁面上方輸入並儲存 Gemini API Key！');
      return;
    }

    const loadingText = document.getElementById('loading-text');
    const expBox = document.getElementById('explanation-box');
    const aiResult = document.getElementById('ai-result');

    loadingText.style.display = 'block';

    try {
      let base64Data = "";
      try {
        const responseImg = await fetch(currentQuestion.image);
        const blob = await responseImg.blob();
        base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (imgErr) {
        throw new Error("圖片讀取失敗，請確認圖片路徑是否正確。");
      }

      const promptText = `請直接分析這張圖形邏輯推理題目，說明為何正確答案是 ${currentQuestion.answer}，並條列出規律。

要求：
1. 嚴禁自我介紹與廢話開場白。
2. 請直接從「規律分析」開始說明。
3. 避免重複性的過程敘述。
4. 表示對角線方向時，請直接使用純文字與符號（如：左上至右下 \\ 或 左下至右上 /）。`;

      // 支援兼顧兩種帶 API Key 的方式（Query Param 與 Header）
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-goog-api-key': apiKey
        },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: "image/png", data: base64Data } }
            ]
          }],
          generationConfig: {
            temperature: 0.1
          }
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let originalText = data.candidates[0].content.parts[0].text;

      let cleanText = originalText
        .replace(/\$?\$?\\rightarrow\$?\$?/g, '>')
        .replace(/\$?\$?\\(backslash|setminus)\$?\$?/g, '\\')
        .replace(/\$?\$?\\(slash)\$?\$?/g, '/')
        .replace(/\(\s*\\\s*\)/g, '( \\ )')
        .replace(/\(\s*\/\s*\)/g, '( / )')
        .replace(/#{1,6}\s?/g, '')
        .replace(/(\*\*|__|\*|_)/g, '')
        .replace(/`{1,3}.*?`{1,3}/g, '')
        .replace(/^\s*[-+*]\s+/gm, '• ')
        .replace(/!\[.*?\]\(.*?\)/g, '')
        .replace(/\[(.*?)\]\(.*?\)/g, '$1')
        .replace(/^\s*>\s+/gm, '')
        .replace(/={3,}|-{3,}/g, '')
        .replace(/\$\$/g, '')
        .replace(/\$/g, '');

      aiResult.innerText = cleanText;
      expBox.style.display = 'block';
    } catch (err) {
      alert("呼叫失敗！原因：" + err.message);
      console.error(err);
    } finally {
      loadingText.style.display = 'none';
    }
  }
